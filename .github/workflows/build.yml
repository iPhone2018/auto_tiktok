name: Build Windows EXE

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main, master ]
    paths:
      - '抖音自动续火花-后端.py'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/build.yml'

jobs:
  build-win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 发布版:隐藏控制台。启动异常靠 %APPDATA%\DouyinSpark\startup.log 定位
          - console: hide
            suffix: ''
          # 调试版:强制显示控制台,首发/排障时用这个跑,报错直接看得见
          - console: force
            suffix: '-debug'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 依赖 + Nuitka
        run: |
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: 构建前端 dist
        run: |
          npm install
          npm run build

      - name: 校验前端产物存在
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/index.html')) {
            Write-Error 'dist/index.html 不存在 —— 前端构建失败或 vite 输出目录被改过,打出来的 exe 会没有界面'
            exit 1
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: 校验 selenium-manager.exe 在包内
        shell: pwsh
        run: |
          # selenium 4.47 的 wheel 已把 selenium-manager.exe 列入 package data,
          # --include-package-data=selenium 会把它作为 exe 一并带入产物;
          # 若再 --include-data-files 指定同一路径,会与已注册的 exe 冲突(Nuitka FATAL)。
          # 这里只做存在性校验,防止 selenium 升级后 exe 从 package data 消失而悄悄丢失
          $sm = python -c "import selenium, os; print(os.path.join(os.path.dirname(selenium.__file__), 'webdriver', 'common', 'windows', 'selenium-manager.exe'))"
          if (-not (Test-Path $sm)) {
            Write-Error "未找到 selenium-manager.exe: $sm"
            exit 1
          }
          Write-Host "selenium-manager(随 package data 打包): $sm"

      - name: Nuitka 打包 exe (${{ matrix.console }})
        shell: pwsh
        run: |
          python -m nuitka --standalone --onefile `
            --assume-yes-for-downloads `
            --windows-console-mode=${{ matrix.console }} `
            --output-filename=DouyinSparkHelper${{ matrix.suffix }}.exe `
            --include-package=uvicorn `
            --include-package-data=selenium `
            --include-package-data=certifi `
            --include-data-dir=dist=dist `
            --nofollow-import-to=tkinter `
            抖音自动续火花-后端.py

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'DouyinSparkHelper${{ matrix.suffix }}.exe'
          if (-not (Test-Path $exe)) { Write-Error "打包产物 $exe 不存在"; exit 1 }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "产物: $exe ($mb MB)"
          if ($mb -lt 20) { Write-Error "产物只有 $mb MB,明显偏小,依赖大概率没打进去"; exit 1 }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinSparkHelper-exe${{ matrix.suffix }}
          path: DouyinSparkHelper${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 30
